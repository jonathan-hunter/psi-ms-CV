# This is a basic workflow to help you get started with Actions

name: OBO file validation

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: obolibrary/odkfull

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2

    # Runs a single command using the runners shell
    - name: Validate OBO files
      run: |
        fastobo-validator --duplicates psi-ms-core.obo
        fastobo-validator --duplicates psi-ms-columns.obo
        fastobo-validator --duplicates psi-ms.obo
    - uses: actions/setup-python@v6
      with:
          python-version: '3.10'
    - name: Check sorting
      run: |
        python -m pip install fastobo
        python scripts/check_sorted.py psi-ms-core.obo
        python scripts/check_sorted.py psi-ms.obo
        python scripts/check_sorted.py psi-ms-columns.obo
    - name: Check column module ids and mapping
      run: |
        python scripts/chrom_columns/check_no_duplicate_ids.py psi-ms-columns.obo
        python scripts/chrom_columns/check_column_mapping.py .github/repo-rt/psi-ms-column-ids.tsv psi-ms-columns.obo
    - name: Check the components do not collide
      # ROBOT would fuse a term id defined in both components instead of failing, so
      # this has to run before the merge -- see scripts/check_components_disjoint.py.
      run: python scripts/check_components_disjoint.py psi-ms-core.obo psi-ms-columns.obo

  # Builds the merged release files from the PR's components and validates them, then
  # throws them away -- update-owl.yaml still generates and commits the real ones after
  # merge. Without this the merge is first exercised on master, and cross-component
  # breakage (columns referencing a core term that moved) lands before anyone sees it.
  build-aggregate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Download ROBOT
      run: |
        curl -fsSL --retry 3 -o robot.jar \
          "https://github.com/ontodev/robot/releases/download/v$(make -s print-robot-version)/robot.jar"
    - name: Build and verify the merged release files
      run: |
        make ROBOT="java -Xmx6G -jar robot.jar" release verify
        python -m pip install fastobo
        python scripts/check_sorted.py psi-ms.obo
