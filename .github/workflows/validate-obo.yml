# This is a basic workflow to help you get started with Actions

name: OBO file validation

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Validates the files as committed. On a source PR that is psi-ms-core.obo and the
  # fragment; on the bot's update-release-obo PR it also covers the rebuilt psi-ms.obo.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: obolibrary/odkfull

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Runs a single command using the runners shell
    - name: Validate OBO files
      run: |
        fastobo-validator --duplicates psi-ms-core.obo
        fastobo-validator --duplicates psi-ms.obo
    - uses: actions/setup-python@v6
      with:
          python-version: '3.10'
    - name: Check sorting
      run: |
        python -m pip install fastobo
        python scripts/check_sorted.py psi-ms-core.obo
        python scripts/check_sorted.py psi-ms-columns.obo-fragment
        python scripts/check_sorted.py psi-ms.obo
    - name: Check column fragment ids and mapping
      run: |
        python scripts/chrom_columns/check_no_duplicate_ids.py psi-ms-columns.obo-fragment
        python scripts/chrom_columns/check_column_mapping.py .github/repo-rt/psi-ms-column-ids.tsv psi-ms-columns.obo-fragment
    - name: Check core still provides the terms the fragment references
      # The fragment's is_a/relationship targets live in psi-ms-core.obo, so a rename or
      # deletion there breaks the release while both files stay individually valid -- a
      # fragment referencing core is legitimate by design, so no per-file validator can
      # see it. This asserts the exact ids and names the generator depends on.
      run: python scripts/chrom_columns/generate_psi_ms_columns.py --check-core-refs

  # The committed psi-ms.obo is rebuilt after merge, so on a source PR it is one build
  # behind and validating it proves nothing about the change under review. This builds
  # what the PR *would* release and validates that instead, then throws it away.
  build-release:
    runs-on: ubuntu-latest
    container:
      image: obolibrary/odkfull
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
          python-version: '3.10'
    - name: Splice and validate the release OBO this PR would produce
      run: |
        python -m pip install fastobo
        python scripts/build_release_obo.py --output /tmp/psi-ms.obo
        fastobo-validator --duplicates /tmp/psi-ms.obo
        python scripts/check_sorted.py /tmp/psi-ms.obo
        python scripts/check_aggregate.py /tmp/psi-ms.obo
