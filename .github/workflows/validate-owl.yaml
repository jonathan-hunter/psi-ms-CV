name: OWL file validation

# Master only, deliberately. This job fetches both its config and the ontology from the
# master raw URLs -- foundry.json's ontology_purl points at master/psi-ms.owl -- so on a
# pull request it validated master's published OWL and could not fail because of the PR
# under review: a green check that meant nothing. It still runs on push to master, which
# is when update-owl.yaml commits a new psi-ms.owl, so the OWL is validated at the first
# moment it exists.
on:
  push:
    branches: [master, dev, "debug/ols-validation"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # Install JDK from Eclipse Adoptium
          java-version: '24'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Maven
        run: mvn -v

      - name: Build OLS dataload
        run: |
           git clone https://github.com/EBISPOT/ols4
           cd ols4/ols-shared/
           mvn clean install
           cd ../../ols4/dataload/rdf2json
           mvn clean install

      - name: Validate OWL File for OLS
        run: |
           cd ols4/dataload/rdf2json/target
           wget https://raw.githubusercontent.com/HUPO-PSI/psi-ms-CV/master/owl-config-ols/foundry.json
           wget https://raw.githubusercontent.com/HUPO-PSI/psi-ms-CV/master/owl-config-ols/fail_owl.json
           java -jar rdf2json-1.0-SNAPSHOT.jar --config foundry.json --output foundry_out.json
           if diff foundry_out.json fail_owl.json > /dev/null; then
              echo "The PSI-MS ontology has an error in the owl file and do not allow to import in OLS"
              exit 1
           else
              echo "PSI-MS is valid"
           fi