name: "Build PSI-MS release files"

on:
  push:
    branches: [master]
    paths:
      - "psi-ms-core.obo"
      - "psi-ms-columns.obo"
      - "VERSION"
      - "Makefile"
  workflow_dispatch: {}

jobs:
  generate-release-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download ROBOT
        run: |
          curl -fsSL --retry 3 -o robot.jar \
            "https://github.com/ontodev/robot/releases/download/v$(make -s print-robot-version)/robot.jar"
      - name: Build merged OBO and OWL releases
        # `verify` holds the same assertions the PR build check runs, so the committed
        # artefacts are held to the contract already proven before merge.
        run: make ROBOT="java -Xmx6G -jar robot.jar" release verify
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          add-paths: |
            psi-ms.obo
            psi-ms.owl
          commit-message: Update PSI-MS release files
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>
          branch: update-release-files
          delete-branch: true
          title: Update PSI-MS release files
          body: ROBOT-generated `psi-ms.obo` and `psi-ms.owl` from the two source components and `VERSION`.
      - name: Approve pull request
        if: (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: juliangruber/approve-pull-request-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.cpr.outputs.pull-request-number }}
      - name: Merge pull request
        if: (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PSI_MS_CV_GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
