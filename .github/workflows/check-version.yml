name: check-release-version

on:
  pull_request:
    branches: [ master ]
    paths:
      - "psi-ms-core.obo"
      - "psi-ms-columns.obo"
      - "VERSION"
      - "Makefile"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a newer merged-release version
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
          if git cat-file -e "${BASE_SHA}:VERSION" 2>/dev/null; then
            BASE_VERSION=$(git show "${BASE_SHA}:VERSION" | tr -d '[:space:]')
          else
            BASE_VERSION=$(git show "${BASE_SHA}:psi-ms.obo" | sed -n 's/^data-version: //p' | head -1)
          fi
          test -n "${CURRENT_VERSION}"
          test -n "${BASE_VERSION}"
          dpkg --compare-versions "${CURRENT_VERSION}" gt "${BASE_VERSION}"
